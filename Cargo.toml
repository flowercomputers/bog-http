[package]
name = "bog-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Serve any bog schema over HTTP: typed routes, snapshot reads, atomic writes."
license = "MIT OR Apache-2.0"

[workspace]
members = ["derive"]

[features]
default = ["derive", "serve", "cors"]
derive = ["dep:bog-http-derive"]
# `Server::serve`: bind, serve, shut down gracefully on ctrl-c / SIGTERM.
serve = ["tokio/net", "tokio/signal"]
# `bog_http::cors`: a CORS layer for an explicit list of origins.
cors = ["dep:tower-http"]

[dependencies]
bog = { git = "https://github.com/flowercomputers/bog", branch = "bog-http", features = ["serde", "schemars"] }
bog-http-derive = { path = "derive", version = "0.1.0", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[[example]]
name = "chat"
required-features = ["serve", "cors"]
